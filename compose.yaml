services:
  api:
    build: ./server
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    env_file: .env
    volumes:
      - journal:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
  sync:
    build: ./server
    command: python sync_worker.py
    env_file: .env
    volumes:
      - journal:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
volumes:
  journal:
